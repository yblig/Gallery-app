<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>KIRANA FAMILY GALLERY</title>
<style>
:root{
  --bg:#0a0a0f;--surface:#14141c;--surface2:#1c1c26;--text:#f2f2f7;--muted:#9a9ab0;
  --accent:#7c5cff;--accent2:#9b7cff;--danger:#ff5c7a;--radius:16px;--shadow:0 8px 24px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --bg:#f7f7fb;--surface:#ffffff;--surface2:#f0f0f7;--text:#17171f;--muted:#6b6b80;
  --accent:#6b46ff;--accent2:#8a6bff;--shadow:0 8px 24px rgba(20,20,40,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
#app{display:flex;min-height:100dvh}
#sidebar{display:none;width:230px;flex-shrink:0;background:var(--surface);border-right:1px solid rgba(128,128,160,.15);padding:18px 12px;position:sticky;top:0;height:100dvh}
#sidebar .brand{font-weight:800;letter-spacing:.5px;font-size:15px;color:var(--accent);margin-bottom:18px;padding:0 8px}
#sidebar button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:12px;color:var(--muted);font-size:14px;transition:.2s}
#sidebar button:hover{background:var(--surface2);color:var(--text)}
#sidebar button.active{background:rgba(124,92,255,.15);color:var(--accent)}
#sidebar svg{width:18px;height:18px}
#content{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 14px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid rgba(128,128,160,.12)}
#topbar h1{font-size:15px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:var(--surface2);transition:.2s}
.iconbtn:hover{background:var(--accent);color:#fff}
.iconbtn svg{width:18px;height:18px}
#main{flex:1;padding:14px 14px 90px;max-width:1200px;width:100%;margin:0 auto}
#bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid rgba(128,128,160,.12);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;font-size:10px;color:var(--muted);border-radius:12px;transition:.2s}
#bottomnav button.active{color:var(--accent)}
#bottomnav svg{width:20px;height:20px}
.card{background:var(--surface);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:12px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;transition:.2s}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{background:var(--danger)}
.btn svg{width:16px;height:16px}
.grid{display:grid;gap:8px}
.grid[data-cols="2"]{grid-template-columns:repeat(2,1fr)}
.grid[data-cols="3"]{grid-template-columns:repeat(3,1fr)}
.grid[data-cols="4"]{grid-template-columns:repeat(4,1fr)}
.grid[data-cols="6"]{grid-template-columns:repeat(6,1fr)}
@media(min-width:640px){.grid[data-cols="2"]{grid-template-columns:repeat(3,1fr)}.grid[data-cols="3"]{grid-template-columns:repeat(4,1fr)}.grid[data-cols="4"]{grid-template-columns:repeat(5,1fr)}.grid[data-cols="6"]{grid-template-columns:repeat(8,1fr)}}
@media(min-width:900px){#sidebar{display:block}#bottomnav{display:none}#main{padding-bottom:30px}}
.photocard{position:relative;border-radius:14px;overflow:hidden;background:var(--surface2);cursor:pointer;transition:transform .2s}
.photocard:hover{transform:translateY(-2px)}
.photocard img{width:100%;aspect-ratio:1;object-fit:cover}
.photocard .label{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photocard .fav{position:absolute;top:6px;right:6px;color:#ff5c7a}
.photocard .chk{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#fff}
.photocard.selected{outline:3px solid var(--accent)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar input,.toolbar select{background:var(--surface2);border:1px solid rgba(128,128,160,.2);border-radius:10px;padding:9px 12px;font-size:13px;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
#feed{height:calc(100dvh - 60px);overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.feeditem{scroll-snap-align:start;height:100%;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
.feeditem img{max-height:100%;max-width:100%;object-fit:contain}
.feeditem .overlay{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 24px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff}
.feeditem .actions{position:absolute;right:12px;bottom:90px;display:flex;flex-direction:column;gap:14px}
.feeditem .actions button{color:#fff;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
.feeditem .actions svg{width:24px;height:24px}
.feeditem .actions .on{color:#ff5c7a}
#viewer{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.96);display:none;flex-direction:column}
#viewer.open{display:flex}
#viewer .vtop{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff}
#viewer .vtop .name{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewer .vimg{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#viewer .vimg img{max-width:100%;max-height:100%;object-fit:contain}
#viewer .vnav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center}
#viewer .vnav.prev{left:10px}#viewer .vnav.next{right:10px}
#viewer .vbottom{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));justify-content:center;flex-wrap:wrap}
#viewer .vbottom button{color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.08)}
#viewer .vbottom button.on{color:#ff5c7a}
#viewer .counter{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;background:rgba(0,0,0,.5);padding:4px 12px;border-radius:20px}
#modalRoot{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:20px}
#modalRoot.open{display:flex}
.modal{background:var(--surface);border-radius:20px;padding:22px;max-width:380px;width:100%;box-shadow:var(--shadow);animation:pop .2s}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{font-size:16px;margin-bottom:8px}
.modal p{font-size:13px;color:var(--muted);margin-bottom:16px}
.modal input,.modal select,.modal textarea{width:100%;background:var(--surface2);border:1px solid rgba(128,128,160,.2);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px;outline:none}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
#toastRoot{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--surface);color:var(--text);padding:10px 18px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);animation:pop .2s}
#memberModal{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px}
#memberModal.open{display:flex}
#memberModal .box{background:var(--surface);border-radius:20px;padding:24px;max-width:400px;width:100%}
#memberModal h2{font-size:17px;margin-bottom:16px;text-align:center}
.membergrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.membercard{background:var(--surface2);border-radius:14px;padding:16px 10px;text-align:center;cursor:pointer;transition:.2s;border:2px solid transparent}
.membercard:hover{border-color:var(--accent);transform:translateY(-2px)}
.membercard .em{font-size:32px}
.membercard .nm{font-size:12px;margin-top:6px;color:var(--muted)}
.progress{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:8px}
.progress>div{height:100%;background:var(--accent);transition:width .2s}
.banner{background:rgba(124,92,255,.12);border:1px solid rgba(124,92,255,.3);border-radius:12px;padding:12px;font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.statrow{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.statbox{background:var(--surface);border-radius:14px;padding:14px;text-align:center}
.statbox .v{font-size:22px;font-weight:800;color:var(--accent)}
.statbox .l{font-size:11px;color:var(--muted);margin-top:3px}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:10px}
.chart .bar{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.chart .bar span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:9px;color:var(--muted)}
.logitem{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(128,128,160,.1);font-size:13px}
.logitem .em{font-size:20px}
.logitem .t{color:var(--muted);font-size:11px;margin-top:2px}
.albumcard{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;transition:.2s;margin-bottom:8px}
.albumcard:hover{background:var(--surface2)}
.albumcard .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:150;background:var(--surface);border-radius:20px 20px 0 0;padding:18px;box-shadow:var(--shadow);transform:translateY(100%);transition:.25s}
.sheet.open{transform:translateY(0)}
.sheet button{display:flex;align-items:center;gap:12px;width:100%;padding:13px;border-radius:12px;font-size:14px}
.sheet button:hover{background:var(--surface2)}
.sheet svg{width:18px;height:18px;color:var(--accent)}
#bulkbar{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:40;display:none;gap:6px;background:var(--surface);padding:8px;border-radius:16px;box-shadow:var(--shadow);flex-wrap:wrap;justify-content:center;max-width:95vw}
#bulkbar.show{display:flex}
#bulkbar button{padding:8px 12px;border-radius:10px;background:var(--surface2);font-size:12px}
.hidden{display:none!important}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const escapeHtml=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(ts){const d=new Date(ts);return d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});}
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(1)+' MB';}
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function timeAgo(ts){const s=Math.floor((Date.now()-ts)/1000);if(s<60)return 'baru saja';const m=Math.floor(s/60);if(m<60)return m+' menit lalu';const h=Math.floor(m/60);if(h<24)return h+' jam lalu';const d=Math.floor(h/24);if(d<30)return d+' hari lalu';const mo=Math.floor(d/30);if(mo<12)return mo+' bulan lalu';return Math.floor(mo/12)+' tahun lalu';}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toastRoot').appendChild(t);setTimeout(()=>t.remove(),2600);}
function modalConfirm(title,msg){return new Promise(res=>{const r=$('#modalRoot');r.innerHTML='<div class="modal"><h3>'+escapeHtml(title)+'</h3><p>'+escapeHtml(msg)+'</p><div class="row"><button class="btn ghost" id="mcNo">Batal</button><button class="btn danger" id="mcYes">Ya</button></div></div>';r.classList.add('open');$('#mcNo').onclick=()=>{r.classList.remove('open');res(false);};$('#mcYes').onclick=()=>{r.classList.remove('open');res(true);};});}
function modalPrompt(title,label,defaultVal){return new Promise(res=>{const r=$('#modalRoot');r.innerHTML='<div class="modal"><h3>'+escapeHtml(title)+'</h3><input id="mpIn" value="'+escapeHtml(defaultVal||'')+'" placeholder="'+escapeHtml(label)+'"><div class="row"><button class="btn ghost" id="mpNo">Batal</button><button class="btn" id="mpYes">Simpan</button></div></div>';r.classList.add('open');const inp=$('#mpIn');inp.focus();$('#mpNo').onclick=()=>{r.classList.remove('open');res(null);};$('#mpYes').onclick=()=>{const v=inp.value.trim();r.classList.remove('open');res(v||null);};inp.onkeydown=e=>{if(e.key==='Enter')$('#mpYes').click();if(e.key==='Escape')$('#mpNo').click();};});}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);}
function makeThumb(blob){return new Promise(res=>{const img=new Image();const url=URL.createObjectURL(blob);img.onload=()=>{const max=500;const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(url);res(b||blob);},'image/jpeg',0.82);};img.onerror=()=>{URL.revokeObjectURL(url);res(blob);};img.src=url;});}
function blobToBase64(blob){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(blob);});}
function base64ToBlob(dataUrl){const parts=dataUrl.split(',');const mime=parts[0].match(/:(.*?);/)[1];const bin=atob(parts[1]);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime});}

let members=[];let activeMember=null;
function loadMembers(){try{members=JSON.parse(localStorage.getItem('kfg_members'))||[];}catch(e){members=[];}
if(!members.length){members=[{id:'m1',name:'Ayah',emoji:'👨',color:'#7c5cff'},{id:'m2',name:'Ibu',emoji:'👩',color:'#ff7ab8'},{id:'m3',name:'Anak',emoji:'🧒',color:'#4fd1c5'}];saveMembers();}
const aid=localStorage.getItem('kfg_active');activeMember=members.find(m=>m.id===aid)||null;}
function saveMembers(){localStorage.setItem('kfg_members',JSON.stringify(members));}
function setActiveMember(id){activeMember=members.find(m=>m.id===id)||null;if(activeMember)localStorage.setItem('kfg_active',id);$('#memberEmoji').textContent=activeMember?activeMember.emoji:'👤';}

const DB_NAME='kfg_db';const DB_VERSION=1;let db=null;
function openDB(){return new Promise((res,rej)=>{const rq=indexedDB.open(DB_NAME,DB_VERSION);rq.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('photos')){const s=d.createObjectStore('photos',{keyPath:'id'});s.createIndex('uploadedAt','uploadedAt');s.createIndex('albumId','albumId');}if(!d.objectStoreNames.contains('albums')){d.createObjectStore('albums',{keyPath:'id'});}if(!d.objectStoreNames.contains('log')){const s=d.createObjectStore('log',{keyPath:'id'});s.createIndex('ts','ts');}};rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
function dbAll(store){return new Promise((res,rej)=>{const t=db.transaction(store,'readonly');const rq=t.objectStore(store).getAll();rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
function dbGet(store,key){return new Promise((res,rej)=>{const t=db.transaction(store,'readonly');const rq=t.objectStore(store).get(key);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
function dbPut(store,val){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite');const rq=t.objectStore(store).put(val);rq.onsuccess=()=>res();rq.onerror=()=>rej(rq.error);});}
function dbDel(store,key){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite');const rq=t.objectStore(store).delete(key);rq.onsuccess=()=>res();rq.onerror=()=>rej(rq.error);});}
function dbClear(store){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite');const rq=t.objectStore(store).clear();rq.onsuccess=()=>res();rq.onerror=()=>rej(rq.error);});}

async function addLog(action,extra){extra=extra||{};const m=activeMember||{id:'unknown',name:'Unknown',emoji:'👤'};const entry={id:uid(),ts:Date.now(),action,memberId:m.id,memberName:m.name,memberEmoji:m.emoji,photoId:extra.photoId||null,photoName:extra.photoName||null,albumName:extra.albumName||null,detail:extra.detail||null};await dbPut('log',entry);}
async function listLogs(){const all=await dbAll('log');return all.sort((a,b)=>b.ts-a.ts);}
async function clearLogs(){await dbClear('log');}

const urlCache=new Map();
function getPhotoURL(p){if(!urlCache.has('full_'+p.id))urlCache.set('full_'+p.id,URL.createObjectURL(p.blob));return urlCache.get('full_'+p.id);}
function getThumbURL(p){if(!urlCache.has('thumb_'+p.id))urlCache.set('thumb_'+p.id,URL.createObjectURL(p.thumb||p.blob));return urlCache.get('thumb_'+p.id);}
function revokeURLs(id){const f=urlCache.get('full_'+id);if(f){URL.revokeObjectURL(f);urlCache.delete('full_'+id);}const t=urlCache.get('thumb_'+id);if(t){URL.revokeObjectURL(t);urlCache.delete('thumb_'+id);}}

const state={photos:[],albums:[],view:'gallery',selected:new Set(),selectMode:false,filters:{q:'',sort:'newest',from:'',to:''},albumId:null,viewerList:[],viewerIndex:0,slideshowTimer:null,slideshowPlaying:false};

function activePhotos(){return state.photos.filter(p=>!p.deleted);}
function getAlbum(id){return state.albums.find(a=>a.id===id)||null;}
function getPhoto(id){return state.photos.find(p=>p.id===id)||null;}

function setView(v){state.view=v;state.selectMode=false;state.selected.clear();updateBulkbar();$$('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===v));const titles={feed:'Feed',gallery:'Galeri',albums:'Album',favorites:'Favorit',memories:'Memories',trash:'Tempat Sampah',log:'Log Aktivitas',stats:'Statistik',settings:'Pengaturan'};$('#topTitle').textContent=titles[v]||'KIRANA FAMILY GALLERY';render();closeSheet();}
function render(){const v=state.view;const m=$('#main');m.innerHTML='';if(v==='feed')renderFeed(m);else if(v==='gallery')renderGallery(m);else if(v==='albums')renderAlbums(m);else if(v==='favorites')renderFavorites(m);else if(v==='memories')renderMemories(m);else if(v==='trash')renderTrash(m);else if(v==='log')renderLog(m);else if(v==='stats')renderStats(m);else if(v==='settings')renderSettings(m);}

$('#uploadBtn').onclick=()=>$('#fileInput').click();
$('#fileInput').onchange=async e=>{const files=Array.from(e.target.files);if(!files.length)return;e.target.value='';const total=files.length;let done=0;const bar=document.createElement('div');bar.className='card';bar.innerHTML='<div style="font-size:13px;margin-bottom:6px">Mengunggah 0/'+total+'</div><div class="progress"><div style="width:0%"></div></div>';$('#main').prepend(bar);const prog=bar.querySelector('.progress>div');const label=bar.querySelector('div');
for(const f of files){try{const thumb=await makeThumb(f);const p={id:uid(),name:f.name,desc:'',blob:f,thumb,size:f.size,type:f.type,uploadedAt:Date.now(),albumId:null,fav:false,likes:0,deleted:false,memberId:activeMember?activeMember.id:'unknown',memberName:activeMember?activeMember.name:'Unknown',memberEmoji:activeMember?activeMember.emoji:'👤',viewedAt:null};await dbPut('photos',p);state.photos.push(p);await addLog('upload',{photoId:p.id,photoName:p.name});}catch(err){toast('Gagal upload: '+f.name);}
done++;label.textContent='Mengunggah '+done+'/'+total;prog.style.width=(done/total*100)+'%';}
setTimeout(()=>bar.remove(),600);toast(total+' foto diunggah');render();};

function renderFeed(m){const photos=shuffle(activePhotos());if(!photos.length){m.innerHTML='<div class="empty"><div class="big">🎬</div><p>Belum ada foto. Upload foto pertamamu!</p></div>';return;}
m.innerHTML='<div id="feed">'+photos.map((p,i)=>'<div class="feeditem" data-idx="'+i+'"><img src="'+getPhotoURL(p)+'" alt="'+escapeHtml(p.name)+'"><div class="overlay"><div style="font-size:14px;font-weight:600">'+escapeHtml(p.name)+'</div><div style="font-size:11px;opacity:.7">'+escapeHtml(p.memberEmoji+' '+p.memberName)+' · '+timeAgo(p.uploadedAt)+'</div></div><div class="actions"><button class="act-like '+(p.likes>0?'on':'')+'" data-id="'+p.id+'"><svg><use href="#i-heart"/></svg>'+p.likes+'</button><button class="act-fav '+(p.fav?'on':'')+'" data-id="'+p.id+'"><svg><use href="#i-star"/></svg></button><button class="act-info" data-id="'+p.id+'"><svg><use href="#i-info"/></svg></button><button class="act-full" data-id="'+p.id+'"><svg><use href="#i-full"/></svg></button></div></div>').join('')+'</div>';
m.querySelectorAll('.act-like').forEach(b=>b.onclick=async()=>{const p=getPhoto(b.dataset.id);p.likes=p.likes>0?0:1;await dbPut('photos',p);await addLog(p.likes>0?'like':'unlike',{photoId:p.id,photoName:p.name});toast(p.likes>0?'Disukai':'Batal suka');render();});
m.querySelectorAll('.act-fav').forEach(b=>b.onclick=async()=>{const p=getPhoto(b.dataset.id);p.fav=!p.fav;await dbPut('photos',p);await addLog(p.fav?'favorite':'unfavorite',{photoId:p.id,photoName:p.name});toast(p.fav?'Ditambahkan ke favorit':'Dihapus dari favorit');render();});
m.querySelectorAll('.act-info').forEach(b=>b.onclick=()=>openViewer(b.dataset.id,photos));
m.querySelectorAll('.act-full').forEach(b=>b.onclick=()=>{const el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen();});}

function filteredPhotos(){let list=activePhotos();const f=state.filters;if(f.q)list=list.filter(p=>p.name.toLowerCase().includes(f.q.toLowerCase()));
if(f.from)list=list.filter(p=>p.uploadedAt>=new Date(f.from).getTime());
if(f.to)list=list.filter(p=>p.uploadedAt<=new Date(f.to).getTime()+86400000);
if(f.sort==='newest')list.sort((a,b)=>b.uploadedAt-a.uploadedAt);
else if(f.sort==='oldest')list.sort((a,b)=>a.uploadedAt-b.uploadedAt);
else if(f.sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name));
else if(f.sort==='random')list=shuffle(list);
return list;}

function renderGallery(m){const list=filteredPhotos();const cols=localStorage.getItem('kfg_grid')||'3';
m.innerHTML='<div class="toolbar"><input id="gSearch" placeholder="Cari nama foto..." value="'+escapeHtml(state.filters.q)+'" style="flex:1;min-width:140px"><select id="gSort"><option value="newest">Terbaru</option><option value="oldest">Terlama</option><option value="random">Acak</option><option value="name">Nama</option></select><input type="date" id="gFrom" value="'+state.filters.from+'"><input type="date" id="gTo" value="'+state.filters.to+'"><button class="btn ghost" id="gSelect">'+(state.selectMode?'Batal':'Pilih')+'</button></div>'+(list.length?'<div class="grid" data-cols="'+cols+'">'+list.map(p=>'<div class="photocard '+(state.selected.has(p.id)?'selected':'')+'" data-id="'+p.id+'">'+(state.selectMode?'<div class="chk">'+(state.selected.has(p.id)?'✓':'')+'</div>':'')+(p.fav?'<div class="fav">❤️</div>':'')+'<img loading="lazy" src="'+getThumbURL(p)+'" alt="'+escapeHtml(p.name)+'"><div class="label">'+escapeHtml(p.name)+'</div></div>').join('')+'</div>':'<div class="empty"><div class="big">🖼️</div><p>Belum ada foto yang cocok.</p></div>');
$('#gSearch').oninput=e=>{state.filters.q=e.target.value;render();};
$('#gSort').value=state.filters.sort;$('#gSort').onchange=e=>{state.filters.sort=e.target.value;render();};
$('#gFrom').onchange=e=>{state.filters.from=e.target.value;render();};
$('#gTo').onchange=e=>{state.filters.to=e.target.value;render();};
$('#gSelect').onclick=()=>{state.selectMode=!state.selectMode;state.selected.clear();updateBulkbar();render();};
m.querySelectorAll('.photocard').forEach(c=>c.onclick=()=>{const id=c.dataset.id;if(state.selectMode){if(state.selected.has(id))state.selected.delete(id);else state.selected.add(id);updateBulkbar();render();}else openViewer(id,filteredPhotos());});}

function updateBulkbar(){const bar=$('#bulkbar');if(state.selectMode&&state.selected.size>0){bar.classList.add('show');bar.innerHTML='<button id="bFav">Favorit</button><button id="bUnfav">Batal Favorit</button><button id="bMove">Pindah Album</button><button id="bDown">Unduh</button><button id="bDel">Hapus</button>';
$('#bFav').onclick=async()=>{for(const id of state.selected){const p=getPhoto(id);if(p){p.fav=true;await dbPut('photos',p);await addLog('favorite',{photoId:id,photoName:p.name});}}toast('Ditambahkan ke favorit');state.selected.clear();updateBulkbar();render();};
$('#bUnfav').onclick=async()=>{for(const id of state.selected){const p=getPhoto(id);if(p){p.fav=false;await dbPut('photos',p);await addLog('unfavorite',{photoId:id,photoName:p.name});}}toast('Dihapus dari favorit');state.selected.clear();updateBulkbar();render();};
$('#bMove').onclick=async()=>{const name=await modalPrompt('Pindah ke album','Nama album','');if(!name)return;let alb=state.albums.find(a=>a.name.toLowerCase()===name.toLowerCase());if(!alb){alb={id:uid(),name,createdAt:Date.now(),memberId:activeMember.id,memberName:activeMember.name,memberEmoji:activeMember.emoji};state.albums.push(alb);await dbPut('albums',alb);await addLog('album-create',{albumName:name});}
for(const id of state.selected){const p=getPhoto(id);if(p){p.albumId=alb.id;await dbPut('photos',p);await addLog('move-album',{photoId:id,photoName:p.name,albumName:name});}}toast('Dipindah ke '+name);state.selected.clear();updateBulkbar();render();};
$('#bDown').onclick=()=>{for(const id of state.selected){const p=getPhoto(id);if(p)downloadBlob(p.blob,p.name);}toast('Mengunduh '+state.selected.size+' foto');};
$('#bDel').onclick=async()=>{const ok=await modalConfirm('Hapus foto?','Foto akan dipindah ke Tempat Sampah.');if(!ok)return;for(const id of state.selected){const p=getPhoto(id);if(p){p.deleted=true;await dbPut('photos',p);await addLog('delete',{photoId:id,photoName:p.name});}}toast('Dipindah ke Tempat Sampah');state.selected.clear();updateBulkbar();render();};}
else bar.classList.remove('show');}

function renderAlbums(m){if(state.albumId){const alb=getAlbum(state.albumId);if(!alb){state.albumId=null;render();return;}
const photos=activePhotos().filter(p=>p.albumId===alb.id);
m.innerHTML='<button class="btn ghost" id="backAlbums" style="margin-bottom:12px">← Kembali</button><div class="card"><div style="display:flex;align-items:center;gap:10px"><div style="flex:1"><div style="font-weight:700;font-size:16px">'+escapeHtml(alb.name)+'</div><div style="font-size:11px;color:var(--muted)">'+photos.length+' foto · oleh '+escapeHtml(alb.memberEmoji+' '+alb.memberName)+'</div></div><button class="iconbtn" id="albRename"><svg><use href="#i-edit"/></svg></button><button class="iconbtn" id="albDelete"><svg><use href="#i-trash"/></svg></button></div></div>'+(photos.length?'<div class="grid" data-cols="3">'+photos.map(p=>'<div class="photocard" data-id="'+p.id+'"><img loading="lazy" src="'+getThumbURL(p)+'"><div class="label">'+escapeHtml(p.name)+'</div></div>').join('')+'</div>':'<div class="empty"><div class="big">📁</div><p>Album kosong.</p></div>');
$('#backAlbums').onclick=()=>{state.albumId=null;render();};
$('#albRename').onclick=async()=>{const v=await modalPrompt('Rename album','Nama album',alb.name);if(!v)return;alb.name=v;await dbPut('albums',alb);await addLog('album-rename',{albumName:v});toast('Album diubah');render();};
$('#albDelete').onclick=async()=>{const ok=await modalConfirm('Hapus album?','Foto di dalamnya tidak akan dihapus.');if(!ok)return;await dbDel('albums',alb.id);state.albums=state.albums.filter(a=>a.id!==alb.id);for(const p of state.photos){if(p.albumId===alb.id){p.albumId=null;await dbPut('photos',p);}}await addLog('album-delete',{albumName:alb.name});state.albumId=null;toast('Album dihapus');render();};
m.querySelectorAll('.photocard').forEach(c=>c.onclick=()=>openViewer(c.dataset.id,photos));return;}
m.innerHTML='<div class="toolbar"><button class="btn" id="newAlbum"><svg><use href="#i-plus"/></svg> Buat Album</button></div>'+(state.albums.length?state.albums.map(a=>{const cnt=activePhotos().filter(p=>p.albumId===a.id).length;return '<div class="albumcard" data-id="'+a.id+'"><div style="font-size:24px">📁</div><div><div style="font-weight:600;font-size:14px">'+escapeHtml(a.name)+'</div><div style="font-size:11px;color:var(--muted)">'+escapeHtml(a.memberEmoji+' '+a.memberName)+'</div></div><div class="cnt">'+cnt+' foto</div></div>';}).join(''):'<div class="empty"><div class="big">📁</div><p>Belum ada album. Buat album pertamamu!</p></div>');
$('#newAlbum').onclick=async()=>{const v=await modalPrompt('Buat album','Nama album','');if(!v)return;const alb={id:uid(),name:v,createdAt:Date.now(),memberId:activeMember.id,memberName:activeMember.name,memberEmoji:activeMember.emoji};state.albums.push(alb);await dbPut('albums',alb);await addLog('album-create',{albumName:v});toast('Album dibuat');render();};
m.querySelectorAll('.albumcard').forEach(c=>c.onclick=()=>{state.albumId=c.dataset.id;render();});}

function renderFavorites(m){let list=activePhotos().filter(p=>p.fav);const f=state.filters;if(f.sort==='newest')list.sort((a,b)=>b.uploadedAt-a.uploadedAt);else if(f.sort==='oldest')list.sort((a,b)=>a.uploadedAt-b.uploadedAt);else if(f.sort==='random')list=shuffle(list);else if(f.sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name));

$('#fSort').value=state.filters.sort;$('#fSort').onchange=e=>{state.filters.sort=e.target.value;render();};
$('#slideBtn').onclick=()=>startSlideshow(list);
m.querySelectorAll('.photocard').forEach(c=>c.onclick=()=>openViewer(c.dataset.id,list));}

function renderMemories(m){const now=new Date();const today=activePhotos().filter(p=>{const d=new Date(p.uploadedAt);return d.getMonth()===now.getMonth()&&d.getDate()===now.getDate()&&d.getFullYear()<now.getFullYear();});
const recent=activePhotos().sort((a,b)=>b.uploadedAt-a.uploadedAt).slice(0,10);
const viewed=activePhotos().filter(p=>p.viewedAt).sort((a,b)=>b.viewedAt-a.viewedAt).slice(0,10);
const favRandom=shuffle(activePhotos().filter(p=>p.fav)).slice(0,10);

m.innerHTML=section('Di hari ini tahun lalu',today)+section('Baru ditambahkan',recent)+section('Baru dilihat',viewed)+section('Favorit acak',favRandom);
m.querySelectorAll('.photocard').forEach(c=>c.onclick=()=>openViewer(c.dataset.id,activePhotos()));}

function renderTrash(m){const list=state.photos.filter(p=>p.deleted).sort((a,b)=>b.uploadedAt-a.uploadedAt);
m.innerHTML='<div class="toolbar"><button class="btn danger" id="emptyTrash"><svg><use href="#i-trash"/></svg> Kosongkan Tempat Sampah</button></div>'+(list.length?'<div class="grid" data-cols="3">'+list.map(p=>'<div class="photocard" data-id="'+p.id+'"><img loading="lazy" src="'+getThumbURL(p)+'"><div class="label">'+escapeHtml(p.name)+'</div></div>').join('')+'</div>':'<div class="empty"><div class="big">🗑️</div><p>Tempat sampah kosong.</p></div>');
$('#emptyTrash').onclick=async()=>{const ok=await modalConfirm('Kosongkan Tempat Sampah?','Semua foto di tempat sampah akan dihapus permanen.');if(!ok)return;for(const p of state.photos.filter(x=>x.deleted)){await dbDel('photos',p.id);revokeURLs(p.id);await addLog('trash-empty',{photoId:p.id,photoName:p.name});}
state.photos=state.photos.filter(p=>!p.deleted);toast('Tempat sampah dikosongkan');render();};
m.querySelectorAll('.photocard').forEach(c=>{c.onclick=async()=>{const p=getPhoto(c.dataset.id);const ok=await modalConfirm('Pulihkan foto?','"'+p.name+'" akan dikembalikan ke galeri.');if(!ok)return;p.deleted=false;await dbPut('photos',p);await addLog('restore',{photoId:p.id,photoName:p.name});toast('Foto dipulihkan');render();};});}

function renderLog(m){const logs=listLogsSync();const membersInLog=[...new Set(logs.map(l=>l.memberId))];
m.innerHTML='<div class="toolbar"><select id="logFilter"><option value="">Semua anggota</option>'+membersInLog.map(id=>{const mem=members.find(x=>x.id===id);return '<option value="'+id+'">'+escapeHtml(mem?mem.emoji+' '+mem.name:id)+'</option>';}).join('')+'</select><button class="btn danger" id="clearLog"><svg><use href="#i-trash"/></svg> Hapus Log</button></div><div class="card">'+(logs.length?logs.map(l=>{const act={upload:'menambahkan foto',favorite:'menambahkan ke favorit',unfavorite:'menghapus dari favorit',like:'menyukai',unlike:'membatalkan suka',rename:'mengubah nama foto',delete:'menghapus',restore:'memulihkan','move-album':'memindahkan', 'album-create':'membuat album','album-rename':'mengubah nama album','album-delete':'menghapus album','trash-empty':'mengosongkan tempat sampah','backup-export':'mengekspor backup','backup-import':'mengimpor backup'}[l.action]||l.action;
let txt=escapeHtml(l.memberName)+' '+act;if(l.photoName)txt+=' "'+escapeHtml(l.photoName)+'"';if(l.albumName)txt+=' album "'+escapeHtml(l.albumName)+'"';
return '<div class="logitem"><div class="em">'+escapeHtml(l.memberEmoji)+'</div><div><div>'+txt+'</div><div class="t">'+timeAgo(l.ts)+'</div></div></div>';}).join(''):'<div class="empty"><div class="big">📜</div><p>Belum ada aktivitas.</p></div>')+'</div>';
$('#logFilter').onchange=render;
$('#clearLog').onclick=async()=>{const ok=await modalConfirm('Hapus semua log?','Log aktivitas akan dihapus permanen.');if(!ok)return;await clearLogs();toast('Log dihapus');render();};}
function listLogsSync(){return [];}
function getLogsSync(){return [];}

function renderStats(m){const photos=activePhotos();const totalSize=photos.reduce((s,p)=>s+p.size,0);
const months={};photos.forEach(p=>{const d=new Date(p.uploadedAt);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');months[key]=(months[key]||0)+1;});
const keys=Object.keys(months).sort().slice(-12);const max=Math.max(1,...keys.map(k=>months[k]));
m.innerHTML='<div class="statrow"><div class="statbox"><div class="v">'+photos.length+'</div><div class="l">Total Foto</div></div><div class="statbox"><div class="v">'+photos.filter(p=>p.fav).length+'</div><div class="l">Favorit</div></div><div class="statbox"><div class="v">'+state.albums.length+'</div><div class="l">Album</div></div><div class="statbox"><div class="v">'+fmtSize(totalSize)+'</div><div class="l">Total Ukuran</div></div></div><div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:6px">Foto per Bulan</div><div class="chart">'+(keys.length?keys.map(k=>'<div class="bar" style="height:'+(months[k]/max*100)+'%"><span>'+k.slice(5)+'</span></div>').join(''):'<p style="font-size:12px;color:var(--muted)">Belum ada data.</p>')+'</div></div>';}

function renderSettings(m){const theme=document.body.dataset.theme;const grid=localStorage.getItem('kfg_grid')||'3';const slide=localStorage.getItem('kfg_slide')||'4000';
m.innerHTML='<div class="banner">📱 <b>Info Sinkronisasi:</b> Aplikasi ini menyimpan foto <b>LOKAL di HP masing-masing</b>. Untuk berbagi foto antar HP: gunakan tombol "Export Backup" di HP pengunggah, kirim file .kfg (JSON) via WhatsApp/email ke HP lain, lalu "Import Backup" di HP penerima. Sync real-time antar HP membutuhkan server (Firebase/Supabase) — di luar cakupan file ini.</div>'+
'<div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:10px">Tampilan</div><div class="toolbar"><button class="btn ghost" id="themeBtn">Tema: '+(theme==='dark'?'Gelap':'Terang')+'</button><select id="gridSel"><option value="2">2 kolom</option><option value="3">3 kolom</option><option value="4">4 kolom</option><option value="6">6 kolom</option></select></div></div>'+
'<div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:10px">Slideshow</div><div class="toolbar"><input type="number" id="slideInt" value="'+slide+'" min="1000" step="500" style="width:100px"> <span style="font-size:12px;color:var(--muted)">ms per foto</span></div></div>'+
'<div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:10px">Penyimpanan</div><div id="storageInfo" style="font-size:13px;color:var(--muted)">Menghitung...</div></div>'+
'<div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:10px">Backup</div><div class="toolbar"><button class="btn" id="exportBtn"><svg><use href="#i-down"/></svg> Export Backup</button><button class="btn ghost" id="importBtn"><svg><use href="#i-upload"/></svg> Import Backup</button><input type="file" id="importFile" accept=".kfg,.json" hidden></div><div class="progress hidden" id="backupProg"><div></div></div></div>'+
'<div class="card"><button class="btn" id="installBtn" style="width:100%;margin-bottom:10px">Install PWA</button><button class="btn danger" id="wipeBtn" style="width:100%">Hapus Semua Data</button></div>';
$('#themeBtn').onclick=()=>{const t=document.body.dataset.theme==='dark'?'light':'dark';document.body.dataset.theme=t;localStorage.setItem('kfg_theme',t);render();};
$('#gridSel').value=grid;$('#gridSel').onchange=e=>{localStorage.setItem('kfg_grid',e.target.value);toast('Ukuran grid diubah');};
$('#slideInt').onchange=e=>{localStorage.setItem('kfg_slide',e.target.value);toast('Interval slideshow diubah');};
if(navigator.storage&&navigator.storage.estimate){navigator.storage.estimate().then(est=>{const el=$('#storageInfo');if(el)el.textContent='Terpakai: '+fmtSize(est.usage||0)+' dari '+fmtSize(est.quota||0);});}else{const el=$('#storageInfo');if(el)el.textContent='Info storage tidak tersedia di browser ini.';}
$('#exportBtn').onclick=exportBackup;
$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=importBackup;
$('#installBtn').onclick=()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;}else toast('PWA belum tersedia untuk install. Gunakan menu browser "Add to Home Screen".');};
$('#wipeBtn').onclick=async()=>{const ok=await modalConfirm('Hapus semua data?','Semua foto, album, dan log akan dihapus permanen.');if(!ok)return;await dbClear('photos');await dbClear('albums');await dbClear('log');state.photos=[];state.albums=[];toast('Semua data dihapus');render();};}

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});

async function exportBackup(){const photos=state.photos;const albums=state.albums;const logs=await listLogs();const bar=$('#backupProg');if(bar){bar.classList.remove('hidden');}
const data={photos:[],albums,logs};
let done=0;for(const p of photos){const b64=await blobToBase64(p.blob);const tb64=p.thumb?await blobToBase64(p.thumb):null;data.photos.push({id:p.id,name:p.name,desc:p.desc,size:p.size,type:p.type,uploadedAt:p.uploadedAt,albumId:p.albumId,fav:p.fav,likes:p.likes,deleted:p.deleted,memberId:p.memberId,memberName:p.memberName,memberEmoji:p.memberEmoji,viewedAt:p.viewedAt,blobB64:b64,thumbB64:tb64});done++;if(bar)bar.querySelector('div').style.width=(done/photos.length*100)+'%';}
const json=JSON.stringify(data);const blob=new Blob([json],{type:'application/json'});downloadBlob(blob,'kfg-backup-'+Date.now()+'.kfg');await addLog('backup-export',{detail:photos.length+' foto'});toast('Backup diekspor');if(bar)setTimeout(()=>bar.classList.add('hidden'),800);}

async function importBackup(e){const file=e.target.files[0];if(!file)return;e.target.value='';const text=await file.text();let data;try{data=JSON.parse(text);}catch(err){toast('File backup tidak valid');return;}
const bar=$('#backupProg');if(bar){bar.classList.remove('hidden');}
const existing=new Set(state.photos.map(p=>p.name+'|'+p.size+'|'+p.uploadedAt));
let added=0,skipped=0;const total=data.photos.length;let done=0;
for(const pd of data.photos){const key=pd.name+'|'+pd.size+'|'+pd.uploadedAt;if(existing.has(key)){skipped++;}else{const blob=base64ToBlob(pd.blobB64);const thumb=pd.thumbB64?base64ToBlob(pd.thumbB64):blob;const p={id:pd.id||uid(),name:pd.name,desc:pd.desc||'',blob,thumb,size:pd.size,type:pd.type,uploadedAt:pd.uploadedAt,albumId:pd.albumId||null,fav:!!pd.fav,likes:pd.likes||0,deleted:!!pd.deleted,memberId:pd.memberId,memberName:pd.memberName,memberEmoji:pd.memberEmoji,viewedAt:pd.viewedAt||null};await dbPut('photos',p);state.photos.push(p);existing.add(key);added++;}
done++;if(bar)bar.querySelector('div').style.width=(done/total*100)+'%';}
for(const ad of (data.albums||[])){if(!state.albums.find(a=>a.id===ad.id)){state.albums.push(ad);await dbPut('albums',ad);}}
for(const ld of (data.logs||[])){await dbPut('log',ld);}
await addLog('backup-import',{detail:added+' ditambah, '+skipped+' dilewati'});
toast('Import selesai: '+added+' foto ditambah, '+skipped+' dilewati');if(bar)setTimeout(()=>bar.classList.add('hidden'),800);render();}

function openViewer(id,list){const idx=list.findIndex(p=>p.id===id);if(idx<0)return;state.viewerList=list;state.viewerIndex=idx;$('#viewer').classList.add('open');showViewerPhoto();
const p=getPhoto(id);if(p){p.viewedAt=Date.now();dbPut('photos',p);const recent=JSON.parse(localStorage.getItem('kfg_recent')||'[]');const nr=[id,...recent.filter(x=>x!==id)].slice(0,50);localStorage.setItem('kfg_recent',JSON.stringify(nr));}}
function showViewerPhoto(){const p=state.viewerList[state.viewerIndex];if(!p){closeViewer();return;}
$('#viewerImg').src=getPhotoURL(p);$('#viewerName').textContent=p.name;$('#viewerCounter').textContent=(state.viewerIndex+1)+' / '+state.viewerList.length;
$('#vLike').classList.toggle('on',p.likes>0);$('#vFav').classList.toggle('on',p.fav);}
function closeViewer(){stopSlideshow();$('#viewer').classList.remove('open');render();}
function viewerNext(){if(state.viewerIndex<state.viewerList.length-1){state.viewerIndex++;showViewerPhoto();}else if(state.slideshowPlaying){state.viewerIndex=0;showViewerPhoto();}}
function viewerPrev(){if(state.viewerIndex>0){state.viewerIndex--;showViewerPhoto();}}
$('#viewerClose').onclick=closeViewer;
$('#viewerNext').onclick=viewerNext;
$('#viewerPrev').onclick=viewerPrev;
$('#vLike').onclick=async()=>{const p=state.viewerList[state.viewerIndex];p.likes=p.likes>0?0:1;await dbPut('photos',p);await addLog(p.likes>0?'like':'unlike',{photoId:p.id,photoName:p.name});showViewerPhoto();toast(p.likes>0?'Disukai':'Batal suka');};
$('#vFav').onclick=async()=>{const p=state.viewerList[state.viewerIndex];p.fav=!p.fav;await dbPut('photos',p);await addLog(p.fav?'favorite':'unfavorite',{photoId:p.id,photoName:p.name});showViewerPhoto();toast(p.fav?'Ditambahkan ke favorit':'Dihapus dari favorit');};
$('#vInfo').onclick=()=>{const p=state.viewerList[state.viewerIndex];const alb=getAlbum(p.albumId);const r=$('#modalRoot');r.innerHTML='<div class="modal"><h3>'+escapeHtml(p.name)+'</h3><p>Ukuran: '+fmtSize(p.size)+'<br>Tanggal: '+fmtDate(p.uploadedAt)+'<br>Uploader: '+escapeHtml(p.memberEmoji+' '+p.memberName)+'<br>Album: '+escapeHtml(alb?alb.name:'-')+'<br>Deskripsi: '+escapeHtml(p.desc||'-')+'</p><div class="row"><button class="btn" id="infoClose">Tutup</button></div></div>';r.classList.add('open');$('#infoClose').onclick=()=>r.classList.remove('open');};
$('#vEdit').onclick=async()=>{const p=state.viewerList[state.viewerIndex];const name=await modalPrompt('Edit nama foto','Nama foto',p.name);if(name===null)return;const desc=await modalPrompt('Edit deskripsi','Deskripsi foto',p.desc);if(desc===null)return;p.name=name;p.desc=desc;await dbPut('photos',p);await addLog('rename',{photoId:p.id,photoName:p.name});toast('Foto diperbarui');showViewerPhoto();render();};
$('#vDownload').onclick=()=>{const p=state.viewerList[state.viewerIndex];downloadBlob(p.blob,p.name);toast('Mengunduh '+p.name);};
$('#vDelete').onclick=async()=>{const p=state.viewerList[state.viewerIndex];const ok=await modalConfirm('Hapus foto?','"'+p.name+'" akan dipindah ke Tempat Sampah.');if(!ok)return;p.deleted=true;await dbPut('photos',p);await addLog('delete',{photoId:p.id,photoName:p.name});toast('Dipindah ke Tempat Sampah');closeViewer();};

let touchX=0;
$('#viewerImgWrap').addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;});
$('#viewerImgWrap').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX;if(dx<-50)viewerNext();else if(dx>50)viewerPrev();});

function startSlideshow(list){if(!list.length){toast('Tidak ada foto untuk slideshow');return;}
openViewer(list[0].id,list);state.slideshowPlaying=true;const interval=parseInt(localStorage.getItem('kfg_slide')||'4000');
state.slideshowTimer=setInterval(viewerNext,interval);toast('Slideshow dimulai');}
function stopSlideshow(){if(state.slideshowTimer){clearInterval(state.slideshowTimer);state.slideshowTimer=null;}state.slideshowPlaying=false;}

document.addEventListener('keydown',e=>{if($('#viewer').classList.contains('open')){if(e.key==='ArrowRight')viewerNext();else if(e.key==='ArrowLeft')viewerPrev();else if(e.key==='Escape')closeViewer();return;}
if(e.key==='g')setView('gallery');else if(e.key==='f')setView('feed');else if(e.key==='a')setView('albums');else if(e.key==='v')setView('favorites');else if(e.key==='/'){e.preventDefault();setView('gallery');setTimeout(()=>{const s=$('#gSearch');if(s)s.focus();},50);}else if(e.key==='Escape'){closeSheet();$('#modalRoot').classList.remove('open');}});

function closeSheet(){$('#moreSheet').classList.remove('open');}
$('#moreBtn').onclick=()=>{$('#moreSheet').classList.toggle('open');};
document.addEventListener('click',e=>{if(!$('#moreSheet').contains(e.target)&&e.target.id!=='moreBtn'&&!e.target.closest('#moreBtn'))closeSheet();});

$$('[data-nav]').forEach(b=>b.onclick=()=>setView(b.dataset.nav));

$('#memberBtn').onclick=()=>{$('#memberModal').classList.add('open');renderMemberGrid();};
function renderMemberGrid(){const g=$('#memberGrid');g.innerHTML=members.map(m=>'<div class="membercard" data-id="'+m.id+'" style="border-color:'+(activeMember&&activeMember.id===m.id?m.color:'transparent')+'"><div class="em">'+m.emoji+'</div><div class="nm">'+escapeHtml(m.name)+'</div></div>').join('');
g.querySelectorAll('.membercard').forEach(c=>c.onclick=()=>{setActiveMember(c.dataset.id);$('#memberModal').classList.remove('open');toast('Profil: '+activeMember.name);});}
$('#addMemberBtn').onclick=async()=>{const name=await modalPrompt('Tambah anggota','Nama anggota','');if(!name)return;const emoji=await modalPrompt('Emoji anggota','Emoji (misal: 🐶)','🙂')||'🙂';const color=await modalPrompt('Warna','Kode warna hex','#7c5cff')||'#7c5cff';const m={id:uid(),name,emoji,color};members.push(m);saveMembers();renderMemberGrid();toast('Anggota ditambahkan');};

async function init(){await openDB();loadMembers();setActiveMember(localStorage.getItem('kfg_active')||members[0].id);
state.photos=await dbAll('photos');state.albums=await dbAll('albums');
const theme=localStorage.getItem('kfg_theme')||'dark';document.body.dataset.theme=theme;
setView('gallery');
if('serviceWorker' in navigator){try{const swCode="self.addEventListener('install',e=>{self.skipWaiting()});self.addEventListener('fetch',e=>{});";const blob=new Blob([swCode],{type:'text/javascript'});await navigator.serviceWorker.register(URL.createObjectURL(blob));}catch(e){}}
const manifest={name:'KIRANA FAMILY GALLERY',short_name:'KFG',start_url:'.',display:'standalone',background_color:'#0a0a0f',theme_color:'#7c5cff',icons:[]};
const mBlob=new Blob([JSON.stringify(manifest)],{type:'application/json'});const link=document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(mBlob);document.head.appendChild(link);}
init();
</script>
</body>
