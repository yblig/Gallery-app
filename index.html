<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>KIRANA FAMILY GALLERY</title>
<style>
:root{
  --bg:#0a0a0f;--surface:#14141c;--surface2:#1c1c26;--text:#f2f2f7;--muted:#9a9ab0;
  --accent:#7c5cff;--danger:#ff5c7a;--radius:16px;--shadow:0 8px 24px rgba(0,0,0,.35);--gap:8px;
}
[data-theme="light"]{
  --bg:#f7f7fb;--surface:#ffffff;--surface2:#f0f0f7;--text:#17171f;--muted:#6b6b80;
  --shadow:0 8px 24px rgba(20,20,40,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;font-size:14px}
body.privacy .photocard img,body.privacy .feeditem img{filter:blur(10px)}
button,a,input,select,textarea{outline:none}
button:focus,a:focus,input:focus,select:focus,textarea:focus{outline:none;box-shadow:none}
::selection{background:var(--accent);color:#fff}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
#app{display:flex;min-height:100dvh}
#sidebar{display:none;width:230px;flex-shrink:0;background:var(--surface);border-right:1px solid rgba(128,128,160,.15);padding:18px 12px;position:sticky;top:0;height:100dvh}
#sidebar .brand{font-weight:800;letter-spacing:.5px;font-size:15px;color:var(--accent);margin-bottom:18px;padding:0 8px}
#sidebar button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:12px;color:var(--muted);font-size:14px;transition:.2s}
#sidebar button:hover{background:var(--surface2);color:var(--text)}
#sidebar button.active{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
#sidebar svg{width:18px;height:18px}
#content{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 14px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid rgba(128,128,160,.12)}
#topbar h1{font-size:15px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topCount{font-size:11px;color:var(--muted)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:var(--surface2);transition:.2s}
.iconbtn:hover{background:var(--accent);color:#fff}
.iconbtn svg{width:18px;height:18px}
#main{flex:1;padding:14px 14px 110px;max-width:1200px;width:100%;margin:0 auto}
#bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid rgba(128,128,160,.12);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;font-size:10px;color:var(--muted);border-radius:12px;transition:.2s}
#bottomnav button.active{color:var(--accent)}
#bottomnav svg{width:20px;height:20px}
#fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:35;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:.2s}
#fab:hover{transform:scale(1.08)}
#fab svg{width:24px;height:24px}
.card{background:var(--surface);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:12px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;transition:.2s}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{background:var(--danger)}
.btn svg{width:16px;height:16px}
.grid{display:grid;gap:var(--gap)}
.grid[data-cols="2"]{grid-template-columns:repeat(2,1fr)}
.grid[data-cols="3"]{grid-template-columns:repeat(3,1fr)}
.grid[data-cols="4"]{grid-template-columns:repeat(4,1fr)}
.grid[data-cols="6"]{grid-template-columns:repeat(6,1fr)}
@media(min-width:640px){.grid[data-cols="2"]{grid-template-columns:repeat(3,1fr)}.grid[data-cols="3"]{grid-template-columns:repeat(4,1fr)}.grid[data-cols="4"]{grid-template-columns:repeat(5,1fr)}.grid[data-cols="6"]{grid-template-columns:repeat(8,1fr)}}
@media(min-width:900px){#sidebar{display:block}#bottomnav{display:none}#fab{bottom:30px}#main{padding-bottom:30px}}
.photocard{position:relative;border-radius:14px;overflow:hidden;background:var(--surface2);cursor:pointer;transition:transform .2s}
.photocard:hover{transform:translateY(-2px)}
.photocard img{width:100%;aspect-ratio:1;object-fit:cover}
.photocard .label{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photocard .fav{position:absolute;top:6px;right:6px;color:#ff5c7a}
.photocard .pin{position:absolute;top:6px;right:28px;color:var(--accent)}
.photocard .chk{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#fff}
.photocard.selected{outline:3px solid var(--accent)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar input,.toolbar select{background:var(--surface2);border:1px solid rgba(128,128,160,.2);border-radius:10px;padding:9px 12px;font-size:13px;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
#feed{height:calc(100dvh - 60px);overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.feeditem{scroll-snap-align:start;height:100%;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
.feeditem img{max-height:100%;max-width:100%;object-fit:contain;transition:transform .2s}
.feeditem .overlay{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 24px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff}
.feeditem .actions{position:absolute;right:12px;bottom:90px;display:flex;flex-direction:column;gap:14px}
.feeditem .actions button{color:#fff;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
.feeditem .actions svg{width:24px;height:24px}
.feeditem .actions .on{color:#ff5c7a}
#viewer{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.96);display:none;flex-direction:column}
#viewer.open{display:flex}
#viewer .vtop{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff}
#viewer .vtop .name{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewer .vimg{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#viewer .vimg img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .2s}
#viewer .vnav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center}
#viewer .vnav.prev{left:10px}#viewer .vnav.next{right:10px}
#viewer .vbottom{display:flex;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));justify-content:center;flex-wrap:wrap}
#viewer .vbottom button{color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.08)}
#viewer .vbottom button.on{color:#ff5c7a}
#viewer .counter{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;background:rgba(0,0,0,.5);padding:4px 12px;border-radius:20px}
#modalRoot{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:20px}
#modalRoot.open{display:flex}
.modal{background:var(--surface);border-radius:20px;padding:22px;max-width:380px;width:100%;box-shadow:var(--shadow);animation:pop .2s;max-height:85dvh;overflow-y:auto}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{font-size:16px;margin-bottom:8px}
.modal p{font-size:13px;color:var(--muted);margin-bottom:16px}
.modal input,.modal select,.modal textarea{width:100%;background:var(--surface2);border:1px solid rgba(128,128,160,.2);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px;outline:none}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
#toastRoot{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--surface);color:var(--text);padding:10px 18px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);animation:pop .2s;pointer-events:auto}
.toast.clickable{cursor:pointer;border:1px solid var(--accent)}
#memberModal{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px}
#memberModal.open{display:flex}
#memberModal .box{background:var(--surface);border-radius:20px;padding:24px;max-width:420px;width:100%;max-height:85dvh;overflow-y:auto}
#memberModal h2{font-size:17px;margin-bottom:16px;text-align:center}
.membergrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.membercard{background:var(--surface2);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;transition:.2s;border:2px solid transparent;position:relative}
.membercard:hover{transform:translateY(-2px)}
.membercard img{width:56px;height:56px;border-radius:50%;object-fit:cover;margin:0 auto 6px}
.membercard .em{font-size:32px}
.membercard .nm{font-size:12px;margin-top:6px;color:var(--muted)}
.membercard .mact{position:absolute;top:6px;right:6px;display:flex;gap:4px}
.membercard .mact button{width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.progress{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:8px}
.progress>div{height:100%;background:var(--accent);transition:width .2s}
.banner{background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:12px;padding:12px;font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.statrow{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.statbox{background:var(--surface);border-radius:14px;padding:14px;text-align:center}
.statbox .v{font-size:22px;font-weight:800;color:var(--accent)}
.statbox .l{font-size:11px;color:var(--muted);margin-top:3px}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:10px}
.chart .bar{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.chart .bar span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:9px;color:var(--muted)}
.logitem{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(128,128,160,.1);font-size:13px}
.logitem .em{font-size:20px}
.logitem .t{color:var(--muted);font-size:11px;margin-top:2px}
.albumcard{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;transition:.2s;margin-bottom:8px}
.albumcard:hover{background:var(--surface2)}
.albumcard img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.albumcard .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:150;background:var(--surface);border-radius:20px 20px 0 0;padding:18px;box-shadow:var(--shadow);transform:translateY(100%);transition:.25s}
.sheet.open{transform:translateY(0)}
.sheet button{display:flex;align-items:center;gap:12px;width:100%;padding:13px;border-radius:12px;font-size:14px}
.sheet button:hover{background:var(--surface2)}
.sheet svg{width:18px;height:18px;color:var(--accent)}
#bulkbar{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:40;display:none;gap:6px;background:var(--surface);padding:8px;border-radius:16px;box-shadow:var(--shadow);flex-wrap:wrap;justify-content:center;max-width:95vw}
#bulkbar.show{display:flex}
#bulkbar button{padding:8px 12px;border-radius:10px;background:var(--surface2);font-size:12px}
#lockScreen{position:fixed;inset:0;z-index:400;background:var(--bg);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#lockScreen.open{display:flex}
#lockScreen input{background:var(--surface2);border:1px solid rgba(128,128,160,.2);border-radius:12px;padding:12px 16px;font-size:18px;text-align:center;letter-spacing:6px;width:200px}
.hidden{display:none!important}
.tagchip{display:inline-block;background:var(--surface2);color:var(--muted);border-radius:8px;padding:2px 8px;font-size:10px;margin-right:4px}
</style>
</head>

<div id="app">
<aside id="sidebar">
  <div class="brand">KIRANA FAMILY GALLERY</div>
  <button data-nav="feed"><svg><use href="#i-play"/></svg>Feed</button>
  <button data-nav="gallery" class="active"><svg><use href="#i-grid"/></svg>Galeri</button>
  <button data-nav="albums"><svg><use href="#i-folder"/></svg>Album</button>
  <button data-nav="favorites"><svg><use href="#i-heart"/></svg>Favorit</button>
  <button data-nav="memories"><svg><use href="#i-spark"/></svg>Memories</button>
  <button data-nav="archive"><svg><use href="#i-folder"/></svg>Arsip</button>
  <button data-nav="trash"><svg><use href="#i-trash"/></svg>Tempat Sampah</button>
  <button data-nav="log"><svg><use href="#i-clock"/></svg>Log Aktivitas</button>
  <button data-nav="stats"><svg><use href="#i-chart"/></svg>Statistik</button>
  <button data-nav="settings"><svg><use href="#i-settings"/></svg>Pengaturan</button>
</aside>
<div id="content">
  <header id="topbar">
    <button class="iconbtn" id="memberBtn" title="Ganti profil"><span id="memberEmoji">👨</span></button>

<script>
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const escapeHtml=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(ts){const d=new Date(ts);return d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});}
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(1)+' MB';}
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function timeAgo(ts){const s=Math.floor((Date.now()-ts)/1000);if(s<60)return 'baru saja';const m=Math.floor(s/60);if(m<60)return m+' menit lalu';const h=Math.floor(m/60);if(h<24)return h+' jam lalu';const d=Math.floor(h/24);if(d<30)return d+' hari lalu';const mo=Math.floor(d/30);if(mo<12)return mo+' bulan lalu';return Math.floor(mo/12)+' tahun lalu';}
function vibrate(){if(navigator.vibrate)navigator.vibrate(10);}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toastRoot').appendChild(t);setTimeout(()=>t.remove(),2600);}
function toastUndo(msg,fn){const t=document.createElement('div');t.className='toast clickable';t.textContent=msg;t.onclick=()=>{fn();t.remove();};$('#toastRoot').appendChild(t);setTimeout(()=>t.remove(),5000);}
function modalConfirm(title,msg){return new Promise(res=>{const r=$('#modalRoot');r.innerHTML='<div class="modal"><h3>'+escapeHtml(title)+'</h3><p>'+escapeHtml(msg)+'</p><div class="row"><button class="btn ghost" id="mcNo">Batal</button><button class="btn danger" id="mcYes">Ya</button></div></div>';r.classList.add('open');$('#mcNo').onclick=()=>{r.classList.remove('open');res(false);};$('#mcYes').onclick=()=>{r.classList.remove('open');res(true);};});}
function modalPrompt(title,label,defaultVal,isPassword){return new Promise(res=>{const r=$('#modalRoot');r.innerHTML='<div class="modal"><h3>'+escapeHtml(title)+'</h3><input id="mpIn" type="'+(isPassword?'password':'text')+'" value="'+escapeHtml(defaultVal||'')+'" placeholder="'+escapeHtml(label)+'"><div class="row"><button class="btn ghost" id="mpNo">Batal</button><button class="btn" id="mpYes">Simpan</button></div></div>';r.classList.add('open');const inp=$('#mpIn');inp.focus();$('#mpNo').onclick=()=>{r.classList.remove('open');res(null);};$('#mpYes').onclick=()=>{const v=inp.value;r.classList.remove('open');res(v);};inp.onkeydown=e=>{if(e.key==='Enter')$('#mpYes').click();if(e.key==='Escape')$('#mpNo').click();};});}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);}
function makeThumb(blob){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(blob);img.onload=()=>{try{const max=500;const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(url);if(b)res(b);else rej(new Error('thumbnail gagal'));},'image/jpeg',0.82);}catch(e){URL.revokeObjectURL(url);rej(e);}};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('gambar tidak bisa dibaca'));};img.src=url;});}
function blobToBase64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob);});}
function base64ToBlob(dataUrl){const parts=dataUrl.split(',');const mime=parts[0].match(/:(.*?);/)[1];const bin=atob(parts[1]);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime});}
function fileToBlob(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(new Blob([r.result],{type:file.type||'image/jpeg'}));r.onerror=()=>rej(r.error);r.readAsArrayBuffer(file);});}

let members=[];let activeMember=null;
function loadMembers(){try{members=JSON.parse(localStorage.getItem('kfg_members'))||[];}catch(e){members=[];}
if(!members.length){members=[{id:'m1',name:'Ayah',emoji:'👨',color:'#7c5cff',photo:'',pass:''},{id:'m2',name:'Ibu',emoji:'👩',color:'#ff7ab8',photo:'',pass:''},{id:'m3',name:'Anak',emoji:'🧒',color:'#4fd1c5',photo:'',pass:''}];saveMembers();}
const aid=localStorage.getItem('kfg_active');activeMember=members.find(m=>m.id===aid)||null;}
function saveMembers(){localStorage.setItem('kfg_members',JSON.stringify(members));}
function setActiveMember(id){activeMember=members.find(m=>m.id===id)||null;if(activeMember)localStorage.setItem('kfg_active',id);$('#memberEmoji').textContent=activeMember?(activeMember.photo?'🖼️':activeMember.emoji):'👤';}

const DB_NAME='kfg_db';const DB_VERSION=1;let db=null;
function openDB(){return new Promise((res,rej)=>{const rq=indexedDB.open(DB_NAME,DB_VERSION);rq.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('photos')){const s=d.createObjectStore('photos',{keyPath:'id'});s.createIndex('uploadedAt','uploadedAt');s.createIndex('albumId','albumId');}if(!d.objectStoreNames.contains('albums')){d.createObjectStore('albums',{keyPath:'id'});}if(!d.objectStoreNames.contains('log')){const s=d.createObjectStore('log',{keyPath:'id'});s.createIndex('ts','ts');}};rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
function dbAll(store){return new Promise((res,rej)=>{const t=db.transaction(store,'readonly');const rq=t.objectStore(store).getAll();rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
function dbGet(store,key){return new Promise((res,rej)=>{const t=db.transaction(store,'readonly');const rq=t.objectStore(store).get(key);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
function dbPut(store,val){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite');const rq=t.objectStore(store).put(val);rq.onsuccess=()=>res();rq.onerror=()=>rej(rq.error);});}
function dbDel(store,key){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite');const rq=t.objectStore(store).delete(key);rq.onsuccess=()=>res();rq.onerror=()=>rej(rq.error);});}
function dbClear(store){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite');const rq=t.objectStore(store).clear();rq.onsuccess=()=>res();rq.onerror=()=>rej(rq.error);});}

async function addLog(action,extra){extra=extra||{};const m=activeMember||{id:'unknown',name:'Unknown',emoji:'👤'};const entry={id:uid(),ts:Date.now(),action,memberId:m.id,memberName:m.name,memberEmoji:m.emoji,photoId:extra.photoId||null,photoName:extra.photoName||null,albumName:extra.albumName||null,detail:extra.detail||null};await dbPut('log',entry);}
async function listLogs(){const all=await dbAll('log');return all.sort((a,b)=>b.ts-a.ts);}
async function clearLogs(){await dbClear('log');}

const urlCache=new Map();
function getPhotoURL(p){if(!urlCache.has('full_'+p.id))urlCache.set('full_'+p.id,URL.createObjectURL(p.blob));return urlCache.get('full_'+p.id);}
function getThumbURL(p){if(!urlCache.has('thumb_'+p.id))urlCache.set('thumb_'+p.id,URL.createObjectURL(p.thumb||p.blob));return urlCache.get('thumb_'+p.id);}
function revokeURLs(id){const f=urlCache.get('full_'+id);if(f){URL.revokeObjectURL(f);urlCache.delete('full_'+id);}const t=urlCache.get('thumb_'+id);if(t){URL.revokeObjectURL(t);urlCache.delete('thumb_'+id);}}

const state={photos:[],albums:[],view:'gallery',selected:new Set(),selectMode:false,filters:{q:'',sort:'newest',from:'',to:'',tag:'',member:''},albumId:null,viewerList:[],viewerIndex:0,slideshowTimer:null,slideshowPlaying:false,albumSort:'date'};
let listLogsCache=[];let lastDeleted=null;

function activePhotos(){return state.photos.filter(p=>!p.deleted&&!p.archived);}
function getAlbum(id){return state.albums.find(a=>a.id===id)||null;}
function getPhoto(id){return state.photos.find(p=>p.id===id)||null;}

function applyAccent(color){document.documentElement.style.setProperty('--accent',color);localStorage.setItem('kfg_accent',color);}
function applyFont(size){document.body.style.fontSize=size+'px';localStorage.setItem('kfg_font',size);}
function applyDensity(d){document.documentElement.style.setProperty('--gap',d==='compact'?'4px':'8px');localStorage.setItem('kfg_density',d);}
function applyTheme(t){if(t==='auto'){const dark=window.matchMedia('(prefers-color-scheme: dark)').matches;document.body.dataset.theme=dark?'dark':'light';}else document.body.dataset.theme=t;localStorage.setItem('kfg_theme',t);}
function setView(v){state.view=v;state.selectMode=false;state.selected.clear();updateBulkbar();$$('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===v));const titles={feed:'Feed',gallery:'Galeri',albums:'Album',favorites:'Favorit',memories:'Memories',archive:'Arsip',trash:'Tempat Sampah',log:'Log Aktivitas',stats:'Statistik',settings:'Pengaturan'};$('#topTitle').textContent=titles[v]||'KIRANA FAMILY GALLERY';render();closeSheet();}
function render(){const v=state.view;const m=$('#main');m.innerHTML='';$('#topCount').textContent=activePhotos().length+' foto';
if(v==='feed')renderFeed(m);else if(v==='gallery')renderGallery(m);else if(v==='albums')renderAlbums(m);else if(v==='favorites')renderFavorites(m);else if(v==='memories')renderMemories(m);else if(v==='archive')renderArchive(m);else if(v==='trash')renderTrash(m);else if(v==='log')renderLog(m);else if(v==='stats')renderStats(m);else if(v==='settings')renderSettings(m);}

async function deletePhoto(p){p.deleted=true;p.deletedAt=Date.now();await dbPut('photos',p);await addLog('delete',{photoId:p.id,photoName:p.name});lastDeleted=p;vibrate();
toastUndo('Dipindah ke Tempat Sampah — ketuk untuk urungkan',async()=>{p.deleted=false;p.deletedAt=null;await dbPut('photos',p);await addLog('restore',{photoId:p.id,photoName:p.name});toast('Dipulihkan');render();});}

function waitForDB(){return new Promise(res=>{if(db)return res();const t=setInterval(()=>{if(db){clearInterval(t);res();}},50);});}

$('#uploadBtn').onclick=()=>$('#fileInput').click();
$('#fab').onclick=()=>$('#fileInput').click();
$('#fileInput').onchange=async e=>{const files=Array.from(e.target.files||[]);if(!files.length)return;e.target.value='';
await waitForDB();
const total=files.length;let done=0;let fail=0;
const bar=document.createElement('div');bar.className='card';bar.innerHTML='<div class="upLabel" style="font-size:13px;margin-bottom:6px">Mengunggah 0/'+total+'</div><div class="progress"><div class="upBar" style="width:0%"></div></div>';
$('#main').prepend(bar);const prog=bar.querySelector('.upBar');const label=bar.querySelector('.upLabel');
for(const f of files){try{if(!f.type.startsWith('image/')){fail++;continue;}
const blob=await fileToBlob(f);
let thumb;try{thumb=await makeThumb(blob);}catch(err){thumb=blob;}
const p={id:uid(),name:f.name,desc:'',tags:[],blob,thumb,size:blob.size,type:blob.type||f.type,uploadedAt:Date.now(),albumId:null,fav:false,likes:0,pinned:false,archived:false,deleted:false,deletedAt:null,rot:0,memberId:activeMember?activeMember.id:'unknown',memberName:activeMember?activeMember.name:'Unknown',memberEmoji:activeMember?activeMember.emoji:'👤',viewedAt:null};
await dbPut('photos',p);state.photos.push(p);await addLog('upload',{photoId:p.id,photoName:p.name});}
catch(err){fail++;toast('Gagal upload '+f.name+': '+(err&&err.message?err.message:'error'));}
done++;label.textContent='Mengunggah '+done+'/'+total;prog.style.width=(done/total*100)+'%';}
setTimeout(()=>bar.remove(),600);
if(fail===0)toast(total+' foto berhasil diunggah');
else toast((total-fail)+' berhasil, '+fail+' gagal');
vibrate();render();};

$('#fsBtn').onclick=async()=>{
  const el=document.documentElement;
  if(!document.fullscreenElement){
    try{
      await el.requestFullscreen();
      if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('portrait').catch(()=>{});
      toast('Mode fullscreen aktif');
    }catch(e){toast('Fullscreen tidak didukung browser ini');}
  }else{
    try{await document.exitFullscreen();toast('Fullscreen dimatikan');}catch(e){}
  }
};
document.addEventListener('fullscreenchange',()=>{
  const on=!!document.fullscreenElement;
  $('#fsBtn').style.background=on?'var(--accent)':'';
  $('#fsBtn').style.color=on?'#fff':'';
});

function renderFeed(m){const photos=shuffle(activePhotos());if(!photos.length){m.innerHTML='<div class="empty"><div class="big">🎬</div><p>Belum ada foto. Upload foto pertamamu!</p></div>';return;}
m.innerHTML='<div id="feed">'+photos.map((p,i)=>'<div class="feeditem" data-idx="'+i+'"><img src="'+getPhotoURL(p)+'" alt="'+escapeHtml(p.name)+'"><div class="overlay"><div style="font-size:14px;font-weight:600">'+escapeHtml(p.name)+'</div><div style="font-size:11px;opacity:.7">'+escapeHtml(p.memberEmoji+' '+p.memberName)+' · '+timeAgo(p.uploadedAt)+'</div></div><div class="actions"><button class="act-like '+(p.likes>0?'on':'')+'" data-id="'+p.id+'"><svg><use href="#i-heart"/></svg>'+p.likes+'</button><button class="act-fav '+(p.fav?'on':'')+'" data-id="'+p.id+'"><svg><use href="#i-star"/></svg></button><button class="act-info" data-id="'+p.id+'"><svg><use href="#i-info"/></svg></button><button class="act-full" data-id="'+p.id+'"><svg><use href="#i-full"/></svg></button></div></div>').join('')+'</div>';
m.querySelectorAll('.act-like').forEach(b=>b.onclick=async()=>{const p=getPhoto(b.dataset.id);p.likes=p.likes>0?0:1;await dbPut('photos',p);await addLog(p.likes>0?'like':'unlike',{photoId:p.id,photoName:p.name});vibrate();toast(p.likes>0?'Disukai':'Batal suka');render();});
m.querySelectorAll('.act-fav').forEach(b=>b.onclick=async()=>{const p=getPhoto(b.dataset.id);p.fav=!p.fav;await dbPut('photos',p);await addLog(p.fav?'favorite':'unfavorite',{photoId:p.id,photoName:p.name});vibrate();toast(p.fav?'Ditambahkan ke favorit':'Dihapus dari favorit');render();});
m.querySelectorAll('.act-info').forEach(b=>b.onclick=()=>openViewer(b.dataset.id,photos));
m.querySelectorAll('.act-full').forEach(b=>b.onclick=()=>{const el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen();});}

function filteredPhotos(){let list=activePhotos();const f=state.filters;if(f.q){const q=f.q.toLowerCase();list=list.filter(p=>p.name.toLowerCase().includes(q)||(p.desc||'').toLowerCase().includes(q)||(p.tags||[]).some(t=>t.toLowerCase().includes(q)));}
if(f.tag)list=list.filter(p=>(p.tags||[]).includes(f.tag));
if(f.member)list=list.filter(p=>p.memberId===f.member);
if(f.from)list=list.filter(p=>p.uploadedAt>=new Date(f.from).getTime());
if(f.to)list=list.filter(p=>p.uploadedAt<=new Date(f.to).getTime()+86400000);
if(f.sort==='newest')list.sort((a,b)=>b.uploadedAt-a.uploadedAt);
else if(f.sort==='oldest')list.sort((a,b)=>a.uploadedAt-b.uploadedAt);
else if(f.sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name));
else if(f.sort==='random')list=shuffle(list);
return list;}

function renderGallery(m){const list=filteredPhotos();const cols=localStorage.getItem('kfg_grid')||'3';
const pinned=list.filter(p=>p.pinned);const normal=list.filter(p=>!p.pinned);
const allTags=[...new Set(state.photos.flatMap(p=>p.tags||[]))];
const allMembers=members;
m.innerHTML='<div class="toolbar"><input id="gSearch" placeholder="Cari nama, deskripsi, tag..." value="'+escapeHtml(state.filters.q)+'" style="flex:1;min-width:120px"><select id="gSort"><option value="newest">Terbaru</option><option value="oldest">Terlama</option><option value="random">Acak</option><option value="name">Nama</option></select><select id="gTag"><option value="">Semua tag</option>'+allTags.map(t=>'<option value="'+escapeHtml(t)+'">'+escapeHtml(t)+'</option>').join('')+'</select><select id="gMember"><option value="">Semua uploader</option>'+allMembers.map(mm=>'<option value="'+mm.id+'">'+escapeHtml(mm.emoji+' '+mm.name)+'</option>').join('')+'</select><input type="date" id="gFrom" value="'+state.filters.from+'"><input type="date" id="gTo" value="'+state.filters.to+'"><button class="btn ghost" id="gSelect">'+(state.selectMode?'Batal':'Pilih')+'</button></div>'+
(pinned.length?'<div class="card"><div style="font-weight:700;font-size:13px;margin-bottom:8px">📌 Disematkan</div><div class="grid" data-cols="'+cols+'">'+pinned.map(p=>'<div class="photocard" data-id="'+p.id+'"><img loading="lazy" src="'+getThumbURL(p)+'"><div class="label">'+escapeHtml(p.name)+'</div></div>').join('')+'</div></div>':'')+
(normal.length?'<div class="grid" data-cols="'+cols+'">'+normal.map(p=>'<div class="photocard '+(state.selected.has(p.id)?'selected':'')+'" data-id="'+p.id+'">'+(state.selectMode?'<div class="chk">'+(state.selected.has(p.id)?'✓':'')+'</div>':'')+(p.fav?'<div class="fav">❤️</div>':'')+(p.pinned?'<div class="pin">📌</div>':'')+'<img loading="lazy" src="'+getThumbURL(p)+'" alt="'+escapeHtml(p.name)+'"><div class="label">'+escapeHtml(p.name)+'</div></div>').join('')+'</div>':(pinned.length?'':'<div class="empty"><div class="big">🖼️</div><p>Belum ada foto yang cocok.</p></div>'));
$('#gSearch').oninput=e=>{state.filters.q=e.target.value;render();};
$('#gSort').value=state.filters.sort;$('#gSort').onchange=e=>{state.filters.sort=e.target.value;render();};
$('#gTag').value=state.filters.tag;$('#gTag').onchange=e=>{state.filters.tag=e.target.value;render();};
$('#gMember').value=state.filters.member;$('#gMember').onchange=e=>{state.filters.member=e.target.value;render();};
$('#gFrom').onchange=e=>{state.filters.from=e.target.value;render();};
$('#gTo').onchange=e=>{state.filters.to=e.target.value;render();};
$('#gSelect').onclick=()=>{state.selectMode=!state.selectMode;state.selected.clear();updateBulkbar();render();};

$('#albRename').onclick=async()=>{const v=await modalPrompt('Rename album','Nama album',alb.name);if(!v)return;alb.name=v;await dbPut('albums',alb);await addLog('album-rename',{albumName:v});toast('Album diubah');render();};

async function exportBackup(){const photos=state.photos;const albums=state.albums;const logs=await listLogs();const bar=$('#backupProg');if(bar){bar.classList.remove('hidden');}
const data={photos:[],albums,logs};
let done=0;for(const p of photos){const b64=await blobToBase64(p.blob);const tb64=p.thumb?await blobToBase64(p.thumb):null;data.photos.push({id:p.id,name:p.name,desc:p.desc,tags:p.tags||[],size:p.size,type:p.type,uploadedAt:p.uploadedAt,albumId:p.albumId,fav:p.fav,likes:p.likes,pinned:p.pinned,archived:p.archived,deleted:p.deleted,rot:p.rot||0,memberId:p.memberId,memberName:p.memberName,memberEmoji:p.memberEmoji,viewedAt:p.viewedAt,blobB64:b64,thumbB64:tb64});done++;if(bar)bar.querySelector('div').style.width=(done/photos.length*100)+'%';}
const json=JSON.stringify(data);const blob=new Blob([json],{type:'application/json'});downloadBlob(blob,'kfg-backup-'+Date.now()+'.kfg');await addLog('backup-export',{detail:photos.length+' foto'});toast('Backup diekspor');if(bar)setTimeout(()=>bar.classList.add('hidden'),800);}

async function importBackup(e){const file=e.target.files[0];if(!file)return;e.target.value='';const text=await file.text();let data;try{data=JSON.parse(text);}catch(err){toast('File backup tidak valid');return;}
const bar=$('#backupProg');if(bar){bar.classList.remove('hidden');}
const existing=new Set(state.photos.map(p=>p.name+'|'+p.size+'|'+p.uploadedAt));
let added=0,skipped=0;const total=data.photos.length;let done=0;
for(const pd of data.photos){const key=pd.name+'|'+pd.size+'|'+pd.uploadedAt;if(existing.has(key)){skipped++;}else{const blob=base64ToBlob(pd.blobB64);const thumb=pd.thumbB64?base64ToBlob(pd.thumbB64):blob;const p={id:pd.id||uid(),name:pd.name,desc:pd.desc||'',tags:pd.tags||[],blob,thumb,size:pd.size,type:pd.type,uploadedAt:pd.uploadedAt,albumId:pd.albumId||null,fav:!!pd.fav,likes:pd.likes||0,pinned:!!pd.pinned,archived:!!pd.archived,deleted:!!pd.deleted,rot:pd.rot||0,memberId:pd.memberId,memberName:pd.memberName,memberEmoji:pd.memberEmoji,viewedAt:pd.viewedAt||null};await dbPut('photos',p);state.photos.push(p);existing.add(key);added++;}
done++;if(bar)bar.querySelector('div').style.width=(done/total*100)+'%';}
for(const ad of (data.albums||[])){if(!state.albums.find(a=>a.id===ad.id)){state.albums.push(ad);await dbPut('albums',ad);}}
for(const ld of (data.logs||[])){await dbPut('log',ld);}
await addLog('backup-import',{detail:added+' ditambah, '+skipped+' dilewati'});
toast('Import selesai: '+added+' ditambah, '+skipped+' dilewati');if(bar)setTimeout(()=>bar.classList.add('hidden'),800);render();}

function openViewer(id,list){const idx=list.findIndex(p=>p.id===id);if(idx<0)return;state.viewerList=list;state.viewerIndex=idx;$('#viewer').classList.add('open');showViewerPhoto();
const p=getPhoto(id);if(p){p.viewedAt=Date.now();dbPut('photos',p);const recent=JSON.parse(localStorage.getItem('kfg_recent')||'[]');const nr=[id,...recent.filter(x=>x!==id)].slice(0,50);localStorage.setItem('kfg_recent',JSON.stringify(nr));}}
function showViewerPhoto(){const p=state.viewerList[state.viewerIndex];if(!p){closeViewer();return;}
const img=$('#viewerImg');img.src=getPhotoURL(p);img.style.transform='rotate('+((p.rot||0))+'deg) scale('+(img.dataset.zoom==='1'?'2':'1')+')';
$('#viewerName').textContent=p.name;$('#viewerCounter').textContent=(state.viewerIndex+1)+' / '+state.viewerList.length;
$('#vLike').classList.toggle('on',p.likes>0);$('#vFav').classList.toggle('on',p.fav);$('#vPin').classList.toggle('on',p.pinned);}
function closeViewer(){stopSlideshow();$('#viewer').classList.remove('open');render();}
function viewerNext(){if(state.viewerIndex<state.viewerList.length-1){state.viewerIndex++;showViewerPhoto();}else if(state.slideshowPlaying){state.viewerIndex=0;showViewerPhoto();}}
function viewerPrev(){if(state.viewerIndex>0){state.viewerIndex--;showViewerPhoto();}}
$('#viewerClose').onclick=closeViewer;
$('#viewerNext').onclick=viewerNext;
$('#viewerPrev').onclick=viewerPrev;
$('#vLike').onclick=async()=>{const p=state.viewerList[state.viewerIndex];p.likes=p.likes>0?0:1;await dbPut('photos',p);await addLog(p.likes>0?'like':'unlike',{photoId:p.id,photoName:p.name});vibrate();showViewerPhoto();toast(p.likes>0?'Disukai':'Batal suka');};
$('#vFav').onclick=async()=>{const p=state.viewerList[state.viewerIndex];p.fav=!p.fav;await dbPut('photos',p);await addLog(p.fav?'favorite':'unfavorite',{photoId:p.id,photoName:p.name});vibrate();showViewerPhoto();toast(p.fav?'Ditambahkan ke favorit':'Dihapus dari favorit');};
$('#vPin').onclick=async()=>{const p=state.viewerList[state.viewerIndex];p.pinned=!p.pinned;await dbPut('photos',p);await addLog(p.pinned?'pin':'unpin',{photoId:p.id,photoName:p.name});vibrate();showViewerPhoto();toast(p.pinned?'Disematkan':'Sematan dilepas');};
$('#vTag').onclick=async()=>{const p=state.viewerList[state.viewerIndex];const v=await modalPrompt('Tag foto','Pisahkan dengan koma',(p.tags||[]).join(', '));if(v===null)return;p.tags=v.split(',').map(t=>t.trim()).filter(Boolean);await dbPut('photos',p);toast('Tag disimpan');};
$('#vInfo').onclick=()=>{const p=state.viewerList[state.viewerIndex];const alb=getAlbum(p.albumId);const r=$('#modalRoot');r.innerHTML='<div class="modal"><h3>'+escapeHtml(p.name)+'</h3><p>Ukuran: '+fmtSize(p.size)+'<br>Tanggal: '+fmtDate(p.uploadedAt)+'<br>Uploader: '+escapeHtml(p.memberEmoji+' '+p.memberName)+'<br>Album: '+escapeHtml(alb?alb.name:'-')+'<br>Tag: '+escapeHtml((p.tags||[]).join(', ')||'-')+'<br>Deskripsi: '+escapeHtml(p.desc||'-')+'</p><div class="row"><button class="btn" id="infoClose">Tutup</button></div></div>';r.classList.add('open');$('#infoClose').onclick=()=>r.classList.remove('open');};
$('#vEdit').onclick=async()=>{const p=state.viewerList[state.viewerIndex];const name=await modalPrompt('Edit nama foto','Nama foto',p.name);if(name===null)return;const desc=await modalPrompt('Edit deskripsi','Deskripsi foto',p.desc);if(desc===null)return;p.name=name;p.desc=desc;await dbPut('photos',p);await addLog('rename',{photoId:p.id,photoName:p.name});toast('Foto diperbarui');showViewerPhoto();render();};
$('#vRotate').onclick=async()=>{const p=state.viewerList[state.viewerIndex];p.rot=((p.rot||0)+90)%360;await dbPut('photos',p);showViewerPhoto();toast('Diputar '+p.rot+'°');};
$('#vShare').onclick=async()=>{const p=state.viewerList[state.viewerIndex];try{const file=new File([p.blob],p.name,{type:p.type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:p.name});}else{downloadBlob(p.blob,p.name);toast('Berbagi tidak didukung, foto diunduh');}}catch(e){toast('Berbagi dibatalkan');}};
$('#vCopy').onclick=async()=>{const p=state.viewerList[state.viewerIndex];try{await navigator.clipboard.write([new ClipboardItem({[p.type]:p.blob})]);toast('Foto disalin');}catch(e){toast('Gagal menyalin foto');}};
$('#vDownload').onclick=()=>{const p=state.viewerList[state.viewerIndex];downloadBlob(p.blob,p.name);toast('Mengunduh '+p.name);};
$('#vExport').onclick=async()=>{const p=state.viewerList[state.viewerIndex];const b64=await blobToBase64(p.blob);const data={meta:{name:p.name,desc:p.desc,tags:p.tags,size:p.size,type:p.type,uploadedAt:p.uploadedAt,memberName:p.memberName},blobB64:b64};downloadBlob(new Blob([JSON.stringify(data)],{type:'application/json'}),p.name+'.json');toast('Foto diekspor dengan metadata');};
$('#vDelete').onclick=async()=>{const p=state.viewerList[state.viewerIndex];const ok=await modalConfirm('Hapus foto?','"'+p.name+'" akan dipindah ke Tempat Sampah.');if(!ok)return;await deletePhoto(p);closeViewer();};

let zoomed=false;
$('#viewerImg').addEventListener('dblclick',()=>{zoomed=!zoomed;const img=$('#viewerImg');const p=state.viewerList[state.viewerIndex];img.style.transform='rotate('+((p.rot||0))+'deg) scale('+(zoomed?'2':'1')+')';});
let touchX=0;
$('#viewerImgWrap').addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;});
$('#viewerImgWrap').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX;if(dx<-50)viewerNext();else if(dx>50)viewerPrev();});

function startSlideshow(list){if(!list.length){toast('Tidak ada foto untuk slideshow');return;}
openViewer(list[0].id,list);state.slideshowPlaying=true;const interval=parseInt(localStorage.getItem('kfg_slide')||'4000');
state.slideshowTimer=setInterval(viewerNext,interval);toast('Slideshow dimulai');}
function stopSlideshow(){if(state.slideshowTimer){clearInterval(state.slideshowTimer);state.slideshowTimer=null;}state.slideshowPlaying=false;}

document.addEventListener('keydown',e=>{if($('#viewer').classList.contains('open')){if(e.key==='ArrowRight')viewerNext();else if(e.key==='ArrowLeft')viewerPrev();else if(e.key==='Escape')closeViewer();return;}
if(e.key==='g')setView('gallery');else if(e.key==='f')setView('feed');else if(e.key==='a')setView('albums');else if(e.key==='v')setView('favorites');else if(e.key==='m')setView('memories');else if(e.key==='r')setView('archive');else if(e.key==='t')setView('trash');else if(e.key==='l')setView('log');else if(e.key==='s')setView('stats');else if(e.key==='/'){e.preventDefault();setView('gallery');setTimeout(()=>{const s=$('#gSearch');if(s)s.focus();},50);}else if(e.key==='Escape'){closeSheet();$('#modalRoot').classList.remove('open');}});

function closeSheet(){$('#moreSheet').classList.remove('open');}
$('#moreBtn').onclick=()=>{$('#moreSheet').classList.toggle('open');};
$('#surpriseBtn').onclick=()=>{const list=activePhotos();if(!list.length){toast('Belum ada foto');return;}const p=shuffle(list)[0];openViewer(p.id,list);};
$('#lockBtn').onclick=async()=>{const v=await modalPrompt('Kunci Aplikasi','PIN (4-8 digit)','',true);if(v===null)return;if(v&&v.length<4){toast('PIN minimal 4 digit');return;}localStorage.setItem('kfg_pin',v);toast(v?'PIN disimpan':'PIN dihapus');};
document.addEventListener('click',e=>{if(!$('#moreSheet').contains(e.target)&&e.target.id!=='moreBtn'&&!e.target.closest('#moreBtn'))closeSheet();});

$$('[data-nav]').forEach(b=>b.onclick=()=>setView(b.dataset.nav));

$('#memberBtn').onclick=()=>{$('#memberModal').classList.add('open');renderMemberGrid();};
function renderMemberGrid(){const g=$('#memberGrid');g.innerHTML=members.map(m=>'<div class="membercard" data-id="'+m.id+'" style="border-color:'+(activeMember&&activeMember.id===m.id?m.color:'transparent')+'">'+(m.photo?'<img src="'+m.photo+'">':'<div class="em">'+m.emoji+'</div>')+'<div class="nm">'+escapeHtml(m.name)+(m.pass?' 🔒':'')+'</div><div class="mact"><button class="medit" data-id="'+m.id+'">✏️</button><button class="mdel" data-id="'+m.id+'">🗑️</button></div></div>').join('');
g.querySelectorAll('.membercard').forEach(c=>{c.onclick=async e=>{if(e.target.closest('.mact'))return;const id=c.dataset.id;const mem=members.find(x=>x.id===id);
if(mem.pass){$('#memberModal').classList.remove('open');const pw=await modalPrompt('Password','Masukkan password '+mem.name,'',true);
if(pw===null||pw!==mem.pass){$('#memberModal').classList.add('open');if(pw!==null)toast('Password salah');return;}}
setActiveMember(id);$('#memberModal').classList.remove('open');vibrate();toast('Profil: '+mem.name);};});
g.querySelectorAll('.medit').forEach(b=>b.onclick=e=>{e.stopPropagation();$('#memberModal').classList.remove('open');openMemberEditor(b.dataset.id);});
g.querySelectorAll('.mdel').forEach(b=>b.onclick=async e=>{e.stopPropagation();const id=b.dataset.id;if(members.length<=1){toast('Minimal harus ada 1 anggota');return;}
const mem=members.find(x=>x.id===id);$('#memberModal').classList.remove('open');
const ok=await modalConfirm('Hapus anggota?','"'+mem.name+'" akan dihapus dari daftar profil.');if(!ok){$('#memberModal').classList.add('open');return;}
members=members.filter(x=>x.id!==id);saveMembers();if(activeMember&&activeMember.id===id){setActiveMember(members[0].id);}
$('#memberModal').classList.add('open');renderMemberGrid();toast('Anggota dihapus');});}

let pendingAvatar=null;
function openMemberEditor(id){const mem=members.find(x=>x.id===id);pendingAvatar=mem.photo||'';
const r=$('#modalRoot');r.innerHTML='<div class="modal"><h3>Edit Anggota</h3><input id="meName" value="'+escapeHtml(mem.name)+'" placeholder="Nama"><input id="meEmoji" value="'+escapeHtml(mem.emoji)+'" placeholder="Emoji"><input type="color" id="meColor" value="'+escapeHtml(mem.color)+'"><input type="password" id="mePass" value="'+escapeHtml(mem.pass)+'" placeholder="Password (opsional)"><button class="btn ghost" id="mePhotoBtn" style="width:100%;margin-bottom:10px">Pilih Foto Profil</button><div class="row"><button class="btn ghost" id="meNo">Batal</button><button class="btn" id="meYes">Simpan</button></div></div>';
r.classList.add('open');
$('#mePhotoBtn').onclick=()=>{const inp=$('#avatarInput');inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{pendingAvatar=rd.result;toast('Foto profil dipilih');};rd.readAsDataURL(f);};inp.click();};
$('#meNo').onclick=()=>{r.classList.remove('open');$('#memberModal').classList.add('open');};
$('#meYes').onclick=()=>{mem.name=$('#meName').value.trim()||mem.name;mem.emoji=$('#meEmoji').value.trim()||mem.emoji;mem.color=$('#meColor').value;mem.pass=$('#mePass').value;mem.photo=pendingAvatar;saveMembers();if(activeMember&&activeMember.id===mem.id)setActiveMember(mem.id);r.classList.remove('open');$('#memberModal').classList.add('open');renderMemberGrid();toast('Anggota diperbarui');};}

$('#addMemberBtn').onclick=async()=>{$('#memberModal').classList.remove('open');
const name=await modalPrompt('Tambah anggota','Nama anggota','');if(name===null){$('#memberModal').classList.add('open');return;}
const emoji=await modalPrompt('Emoji anggota','Emoji (misal: 🐶)','🙂')||'🙂';const color=await modalPrompt('Warna','Kode warna hex','#7c5cff')||'#7c5cff';const pass=await modalPrompt('Password','Password (opsional)','',true)||'';
const m={id:uid(),name,emoji,color,pass,photo:''};
const r=$('#modalRoot');r.innerHTML='<div class="modal"><h3>Foto Profil (opsional)</h3><button class="btn ghost" id="amPhotoBtn" style="width:100%;margin-bottom:10px">Pilih Foto Profil</button><div class="row"><button class="btn" id="amDone">Selesai</button></div></div>';r.classList.add('open');
$('#amPhotoBtn').onclick=()=>{const inp=$('#avatarInput');inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{m.photo=rd.result;toast('Foto profil dipilih');};rd.readAsDataURL(f);};inp.click();};
$('#amDone').onclick=()=>{members.push(m);saveMembers();r.classList.remove('open');$('#memberModal').classList.add('open');renderMemberGrid();toast('Anggota ditambahkan');};};

async function init(){db=await openDB();loadMembers();setActiveMember(localStorage.getItem('kfg_active')||members[0].id);
state.photos=await dbAll('photos');state.albums=await dbAll('albums');
await refreshLogs();
const cutoff=Date.now()-30*86400000;const old=state.photos.filter(p=>p.deleted&&(p.deletedAt||p.uploadedAt)<cutoff);
for(const p of old){await dbDel('photos',p.id);revokeURLs(p.id);}
if(old.length)state.photos=state.photos.filter(p=>!old.includes(p));
applyTheme(localStorage.getItem('kfg_theme')||'dark');
applyAccent(localStorage.getItem('kfg_accent')||'#7c5cff');
applyFont(localStorage.getItem('kfg_font')||'14');
applyDensity(localStorage.getItem('kfg_density')||'comfort');
document.body.classList.toggle('privacy',localStorage.getItem('kfg_privacy')==='1');
const pin=localStorage.getItem('kfg_pin');
if(pin){$('#lockScreen').classList.add('open');$('#lockOk').onclick=()=>{if($('#lockPin').value===pin){$('#lockScreen').classList.remove('open');$('#lockPin').value='';setView('gallery');}else{toast('PIN salah');$('#lockPin').value='';}};$('#lockPin').onkeydown=e=>{if(e.key==='Enter')$('#lockOk').click();};}
else setView('gallery');
if(!localStorage.getItem('kfg_onboarded')){const r=$('#modalRoot');r.innerHTML='<div class="modal"><h3>Selamat datang! 👋</h3><p>1. Pilih profil anggota keluarga.<br>2. Upload foto lewat tombol +.<br>3. Buat album, favorit, dan jelajahi memories.<br>4. Atur warna tema & privasi di Pengaturan.</p><div class="row"><button class="btn" id="obOk">Mulai</button></div></div>';r.classList.add('open');$('#obOk').onclick=()=>{r.classList.remove('open');localStorage.setItem('kfg_onboarded','1');};}
if('serviceWorker' in navigator){try{const swCode="self.addEventListener('install',e=>{self.skipWaiting()});self.addEventListener('fetch',e=>{});";const blob=new Blob([swCode],{type:'text/javascript'});await navigator.serviceWorker.register(URL.createObjectURL(blob));}catch(e){}}
const manifest={name:'KIRANA FAMILY GALLERY',short_name:'KFG',start_url:'.',display:'standalone',background_color:'#0a0a0f',theme_color:'#7c5cff',icons:[]};
const mBlob=new Blob([JSON.stringify(manifest)],{type:'application/json'});const link=document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(mBlob);document.head.appendChild(link);}
init();
</script>
</body>
